### Key bindings
# Start a terminal
bindsym $mod+Return exec $term
bindsym $mod+c exec $term

# Kill focused window
bindsym $mod+Shift+q kill

# Start your launcher
bindsym $mod+r exec $menu

# Reload the configuration file
bindsym $mod+Shift+c reload

bindsym $mod+b exec firefox-developer-edition

bindsym $mod+s exec wofi-search.sh

bindsym $mod+p exec cliphist list | wofi --dmenu --normal-window --cache-file=/dev/null | cliphist decode | wl-copy

# Exit sway (logs you out of your Wayland session)
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

bindsym Print exec grim -g "$(slurp)" - | wl-copy
bindsym Shift+Print exec grim -o $(swaymsg -t get_outputs | jq -r '.[] | select(.focused) | .name') - | wl-copy
bindsym $mod+Shift+Print exec grim - | wl-copy

bindsym $mod+i exec wofi --dmenu --normal-window | wl-copy --trim-newline

bindsym $mod+Shift+y exec killall -9 fcitx5 && sleep 1 && fcitx5 -rd
