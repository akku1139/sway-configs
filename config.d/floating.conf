# https://www.reddit.com/r/swaywm/comments/cuccbr/get_window_classroletitle_in_sway/

#for_window [app_id="firefox-developer-edition" title="Firefox Developer Edition.*"] floating enable
#for_window [app_id="firefox-developer-edition" title=".* — Firefox Developer Edition.*"] floating enable

#for_window [title=".* — Cachy Browser"] floating disable
#for_window [title="Extension: .* — Cachy Browser"] floating enable

#for_window [app_id="firefox-developer-edition" title="Extension: \(NoScript\) - NoScript XSS Warning — Firefox Developer Edition.*"] floating enable

# https://gist.github.com/b0o/f00de53aa44ff53b39f997d83b7b5585
for_window {
  [title="^🌴⬆🪟"] {
    floating enable
  }
}

