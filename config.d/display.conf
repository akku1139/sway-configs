# main, JAPANNEXT
set $monitor1 DP-2
# buffalo, iGPU VGA
set $monitor2 VGA-1
# HDMI
# iGPU
set $monitor3 HDMI-A-2
#set $monitor3 HDMI-A-4

output $monitor1 {
  pos 0,0
# mclk:        1000 MHz
  mode 1920x1080@165.000Hz
  #mode 1920x1080@144.003Hz
  #mode 1920x1080@120.000Hz

  #adaptive_sync on
  render_bit_depth 8

  # for HDMI

  # needs 50Hz
  #adaptive_sync on
  #mode 1920x1080@50.000Hz
  #mode 1920x1080@60.000Hz

  #mode 1920x1080@144.003Hz

  # or
  # sudo sh -c 'echo low > /sys/class/drm/card2/device/power_dpm_force_performance_level'

  # sudo sh -c 'echo manual > /sys/class/drm/card2/device/power_dpm_force_performance_level'
  # doas sh -c 'echo "2" > /sys/class/drm/card2/device/pp_dpm_mclk'
  # /sys/class/drm/card2/device/pp_dpm_mclk
  # /etc/udev/rules.d/30-amdgpu-clk.rules
}
output $monitor2 {
  pos 1920,0
}
output $monitor3 {
  pos 3200,0
  #adaptive_sync on
}

exec swaymsg focus output DP-2

bindsym $mod+Delete focus output $monitor1
bindsym $mod+End focus output $monitor2
bindsym $mod+Page_Down focus output $monitor3

workspace 1 output $monitor1
workspace 9 output $monitor2
workspace 10 output $monitor3
